<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVALAND — AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root {
  --cream: #fdf8f0;
  --warm-white: #fffef9;
  --soft-yellow: #f5e6b2;
  --gold: #d4a847;
  --gold-light: #e8c96a;
  --gold-dark: #a07830;
  --ink: #1a1410;
  --ink-light: #3d3020;
  --muted: #8a7a6a;
  --muted-light: #bfb0a0;
  --border: rgba(212,168,71,0.2);
  --border-strong: rgba(212,168,71,0.45);
  --card-bg: rgba(255,254,249,0.92);
  --shadow: 0 4px 24px rgba(60,40,10,0.10);
  --shadow-lg: 0 12px 48px rgba(60,40,10,0.16);
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar-w: 260px;
  --danger: #bf5555;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
  display: flex;
}

/* ── Noise texture bg ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(245,230,178,0.55) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 90%, rgba(212,168,71,0.15) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ════════════ SIDEBAR ════════════ */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: rgba(255,254,249,0.95);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border-strong);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: relative;
  z-index: 200;
  box-shadow: 4px 0 32px rgba(60,40,10,0.07);
  transition: transform 0.25s ease;
}

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
}

.logo-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(212,168,71,0.35);
  flex-shrink: 0;
  color: white;
  font-size: 1rem;
}

.logo-text {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo-sub {
  font-size: 0.62rem;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  margin-top: 1px;
}

.new-chat-btn {
  width: 100%;
  padding: 9px 14px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(212,168,71,0.3);
  letter-spacing: 0.3px;
}
.new-chat-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

.sidebar-section {
  padding: 12px 16px 6px;
  font-size: 0.62rem;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  color: var(--muted-light);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.chat-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.chat-list::-webkit-scrollbar { width: 3px; }
.chat-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.chat-item {
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 9px;
  transition: all 0.15s;
  margin-bottom: 2px;
  border: 1px solid transparent;
}
.chat-item:hover { background: var(--soft-yellow); border-color: var(--border); }
.chat-item.active {
  background: linear-gradient(135deg, var(--soft-yellow), rgba(212,168,71,0.18));
  border-color: var(--border-strong);
}
.chat-item-icon { flex-shrink: 0; color: var(--muted); }
.chat-item-content { flex: 1; min-width: 0; }
.chat-item-title { font-size: 0.8rem; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-item-preview { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.chat-item-delete {
  opacity: 0; background: none; border: none;
  color: var(--muted); cursor: pointer; padding: 3px; border-radius: 6px;
  transition: all 0.15s; flex-shrink: 0; display: flex;
}
.chat-item:hover .chat-item-delete { opacity: 1; }
.chat-item-delete:hover { color: var(--danger); background: rgba(191,85,85,0.1); }

.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
}
.back-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 14px;
  background: var(--soft-yellow);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--ink-light);
  transition: all 0.2s;
  text-decoration: none;
  width: 100%;
}
.back-btn:hover { background: rgba(212,168,71,0.25); color: var(--gold-dark); }
.back-btn i { color: var(--gold-dark); }

.server-info-mini {
  margin-top: 10px;
  font-size: 0.68rem;
  color: var(--muted-light);
  letter-spacing: 0.5px;
  line-height: 1.7;
  padding: 0 2px;
}
.server-info-mini strong { color: var(--gold); }

/* ════════════ MAIN ════════════ */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: relative;
  z-index: 1;
  overflow: hidden;
}

.chat-header {
  padding: 0 28px;
  height: 60px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(253,248,240,0.9);
  backdrop-filter: blur(16px);
  flex-shrink: 0;
}

.chat-header-left { display: flex; align-items: center; gap: 12px; }

#sidebarToggle {
  display: none;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 4px;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
}

.chat-title-header {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 60%, var(--gold-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-sub {
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 1px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #4caf50;
  box-shadow: 0 0 4px rgba(76,175,80,0.6);
  animation: pulse 2s infinite;
  flex-shrink: 0;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

/* ════════════ MESSAGES ════════════ */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0;
  scroll-behavior: smooth;
}
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

/* Welcome screen */
.welcome-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 40px 24px;
  text-align: center;
}

.welcome-logo {
  width: 68px; height: 68px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
  box-shadow: 0 8px 32px rgba(212,168,71,0.35);
  animation: float 4s ease-in-out infinite;
  color: white;
  font-size: 1.8rem;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }

.welcome-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}

.welcome-sub {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 28px;
  max-width: 360px;
  line-height: 1.7;
}

.welcome-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 480px;
}

.chip {
  background: var(--soft-yellow);
  border: 1px solid var(--border-strong);
  border-radius: 40px;
  padding: 7px 16px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--ink-light);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.chip:hover { background: rgba(212,168,71,0.25); color: var(--gold-dark); border-color: var(--gold); transform: translateY(-1px); }
.chip i { color: var(--gold-dark); font-size: 0.7rem; }

/* Message rows */
.message-row {
  padding: 4px 28px;
  display: flex;
  gap: 12px;
  animation: msgIn 0.2s ease;
}
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.message-row.user { justify-content: flex-end; }

.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}
.msg-avatar.ai {
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  font-family: 'Playfair Display', serif;
  font-size: 0.6rem;
  font-weight: 900;
  color: white;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 10px rgba(212,168,71,0.3);
}
.msg-avatar.user {
  background: var(--soft-yellow);
  border: 1px solid var(--border-strong);
  color: var(--muted);
}

.msg-bubble {
  max-width: 660px;
  padding: 11px 15px;
  border-radius: var(--radius);
  font-size: 0.88rem;
  line-height: 1.7;
}
.msg-bubble.user {
  background: linear-gradient(135deg, var(--soft-yellow), rgba(212,168,71,0.18));
  border: 1px solid var(--border-strong);
  color: var(--ink);
  border-bottom-right-radius: 4px;
}
.msg-bubble.ai {
  background: var(--card-bg);
  border: 1px solid var(--border);
  color: var(--ink);
  border-bottom-left-radius: 4px;
  box-shadow: var(--shadow);
}

.msg-img-preview {
  max-width: 280px; max-height: 200px;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  display: block;
  border: 1px solid var(--border);
  object-fit: cover;
}

/* Markdown styles inside bubble */
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3 {
  font-family: 'Playfair Display', serif;
  color: var(--gold-dark);
  margin: 14px 0 6px;
  font-size: 0.95rem;
}
.msg-bubble h1 { font-size: 1.1rem; }
.msg-bubble p { margin-bottom: 8px; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble strong { color: var(--ink-light); font-weight: 700; }
.msg-bubble em { color: var(--muted); font-style: italic; }
.msg-bubble a { color: var(--gold-dark); text-decoration: none; border-bottom: 1px solid var(--border-strong); }
.msg-bubble a:hover { color: var(--gold); }
.msg-bubble ul,.msg-bubble ol { padding-left: 20px; margin: 6px 0; }
.msg-bubble li { margin-bottom: 3px; }
.msg-bubble code:not(pre code) {
  background: rgba(212,168,71,0.12);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 6px;
  font-size: 0.78rem;
  font-family: monospace;
  color: var(--gold-dark);
}
.msg-bubble pre {
  background: var(--ink);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 8px 0;
}
.msg-bubble pre code { font-size: 0.78rem; padding: 14px; display: block; }
.msg-bubble blockquote {
  border-left: 3px solid var(--gold);
  padding-left: 12px;
  color: var(--muted);
  margin: 8px 0;
}
.msg-bubble hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
.msg-bubble table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin: 8px 0; }
.msg-bubble th { background: var(--soft-yellow); color: var(--ink-light); padding: 7px 10px; border: 1px solid var(--border-strong); font-weight: 700; text-align: left; }
.msg-bubble td { padding: 6px 10px; border: 1px solid var(--border); }

/* Thinking dots */
.thinking-dots { display: flex; gap: 5px; padding: 4px 0; }
.thinking-dots span {
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
  animation: dot 1.2s infinite;
  opacity: 0.5;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot { 0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-5px);opacity:1} }

/* ════════════ INPUT AREA ════════════ */
.input-area {
  padding: 10px 28px 14px;
  background: rgba(253,248,240,0.98);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(16px);
  flex-shrink: 0;
}

.img-preview-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.img-thumb-wrap { position: relative; display: inline-flex; }
.img-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); }
.img-thumb-remove {
  position: absolute; top: -5px; right: -5px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--danger);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 8px;
}

.input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--soft-yellow);
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 10px 12px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-wrap:focus-within {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212,168,71,0.12);
}

#userInput {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  resize: none;
  max-height: 140px;
  line-height: 1.55;
  overflow-y: auto;
}
#userInput::placeholder { color: var(--muted-light); }

.img-upload-btn {
  width: 32px; height: 32px;
  background: var(--card-bg);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  color: var(--muted);
  font-size: 0.85rem;
}
.img-upload-btn:hover { border-color: var(--gold); color: var(--gold-dark); }

#sendBtn {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  color: white;
  font-size: 0.8rem;
  box-shadow: 0 3px 10px rgba(212,168,71,0.3);
}
#sendBtn:hover { filter: brightness(1.1); transform: scale(1.05); }
#sendBtn:disabled { background: var(--muted-light); color: white; cursor: not-allowed; transform: none; box-shadow: none; }

#fileInput { display: none; }

.input-hint {
  font-size: 0.65rem;
  color: var(--muted-light);
  text-align: center;
  margin-top: 7px;
  letter-spacing: 0.3px;
}

/* ════════════ OVERLAY ════════════ */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(26,20,16,0.5);
  z-index: 150;
}
.overlay.show { display: block; }

/* ════════════ RESPONSIVE ════════════ */
@media (max-width: 768px) {
  #sidebar {
    position: fixed;
    left: -280px;
    transition: left 0.3s ease;
    z-index: 200;
  }
  #sidebar.open { left: 0; }
  #sidebarToggle { display: flex; }
  .message-row { padding: 4px 14px; }
  .chat-header { padding: 0 14px; }
  .input-area {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 10px 14px env(safe-area-inset-bottom, 12px);
    z-index: 50;
  }
  #messages { padding-bottom: 90px; }
}
</style>
</head>

// ════════════ STATE ════════════
let pendingImages = [];
let chats = [];  // Әрдайым бос — жаңа чаттан басталу
let currentChatId = null;
let isLoading = false;

function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ════════════ FILE UPLOAD ════════════
function handleFileSelect(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev => {
      pendingImages.push({ dataUrl: ev.target.result, base64: ev.target.result.split(',')[1], mimeType: file.type });
      renderPreviewStrip();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function renderPreviewStrip() {
  const strip = document.getElementById('imgPreviewStrip');
  strip.innerHTML = pendingImages.map((img, i) => `
    <div class="img-thumb-wrap">
      <img class="img-thumb" src="${img.dataUrl}" alt="preview">
      <button class="img-thumb-remove" onclick="removeImage(${i})">✕</button>
    </div>
  `).join('');
}

function removeImage(i) {
  pendingImages.splice(i, 1);
  renderPreviewStrip();
}

// Drag & drop
document.addEventListener('DOMContentLoaded', () => {
  const messagesEl = document.getElementById('messages');
  messagesEl.addEventListener('dragover', e => e.preventDefault());
  messagesEl.addEventListener('drop', e => {
    e.preventDefault();
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        pendingImages.push({ dataUrl: ev.target.result, base64: ev.target.result.split(',')[1], mimeType: file.type });
        renderPreviewStrip();
      };
      reader.readAsDataURL(file);
    });
  });
});

// Paste image
document.addEventListener('paste', e => {
  Array.from(e.clipboardData.items || []).forEach(item => {
    if (!item.type.startsWith('image/')) return;
    const file = item.getAsFile();
    const reader = new FileReader();
    reader.onload = ev => {
      pendingImages.push({ dataUrl: ev.target.result, base64: ev.target.result.split(',')[1], mimeType: item.type });
      renderPreviewStrip();
    };
    reader.readAsDataURL(file);
  });
});

// ════════════ CHAT MANAGEMENT ════════════
function newChat() {
  const id = generateId();
  chats.unshift({ id, title: 'Жаңа чат...', messages: [], createdAt: Date.now() });
  loadChat(id);
  renderChatList();
  closeSidebar();
}

function loadChat(id) {
  currentChatId = id;
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  const messagesEl = document.getElementById('messages');
  if (chat.messages.length === 0) {
    messagesEl.innerHTML = '';
    messagesEl.appendChild(createWelcomeScreen());
  } else {
    messagesEl.innerHTML = '';
    chat.messages.forEach(msg => appendMessage(msg.role, msg.content, msg.images, false));
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  document.getElementById('chatTitleHeader').textContent = 'NOVALAND AI';
  renderChatList();
}

function createWelcomeScreen() {
  const div = document.createElement('div');
  div.className = 'welcome-screen';
  div.id = 'welcomeScreen';
  div.innerHTML = `
    <div class="welcome-logo"><i class="fa-solid fa-robot"></i></div>
    <div class="welcome-title">NOVALAND AI</div>
    <div class="welcome-sub">NovaLand сервері туралы кез келген сұрағыңызды қойыңыз — донаттар, алтындар, ережелер және тағы басқа!</div>
    <div class="welcome-chips">
      <div class="chip" onclick="askChip('Донаттар мен рангтар қанша тұрады?')"><i class="fa-solid fa-crown"></i> Рангтар бағасы</div>
      <div class="chip" onclick="askChip('1000 алтын қанша теңге?')"><i class="fa-solid fa-coins"></i> Алтын есептеу</div>
      <div class="chip" onclick="askChip('Серверге қалай қосылуға болады?')"><i class="fa-solid fa-server"></i> Серверге қосылу</div>
      <div class="chip" onclick="askChip('Кейстер қанша тұрады?')"><i class="fa-solid fa-box-open"></i> Кейстер</div>
      <div class="chip" onclick="askChip('Донат қалай сатып алынады? Қадамдарды түсіндір')"><i class="fa-solid fa-cart-shopping"></i> Донат сатып алу</div>
      <div class="chip" onclick="askChip('Сервер ережелерін айт')"><i class="fa-solid fa-scale-balanced"></i> Ережелер</div>
    </div>`;
  return div;
}

function askChip(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function renderChatList() {
  const list = document.getElementById('chatList');
  if (chats.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted-light);font-size:0.72rem;padding:16px 0;">Сөйлесу жоқ</div>';
    return;
  }
  list.innerHTML = chats.map(chat => `
    <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" onclick="loadChat('${chat.id}')">
      <div class="chat-item-icon"><i class="fa-regular fa-message" style="font-size:0.75rem"></i></div>
      <div class="chat-item-content">
        <div class="chat-item-title">${escapeHtml(chat.title)}</div>
        <div class="chat-item-preview">${chat.messages.length > 0 ? escapeHtml((chat.messages[chat.messages.length-1].content||'').slice(0,38))+'...' : 'Бос чат...'}</div>
      </div>
      <button class="chat-item-delete" onclick="deleteChat(event,'${chat.id}')">
        <i class="fa-regular fa-trash-can" style="font-size:0.72rem"></i>
      </button>
    </div>
  `).join('');
}

function deleteChat(e, id) {
  e.stopPropagation();
  chats = chats.filter(c => c.id !== id);
  if (currentChatId === id) {
    if (chats.length > 0) loadChat(chats[0].id);
    else {
      currentChatId = null;
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = '';
      messagesEl.appendChild(createWelcomeScreen());
    }
  }
  renderChatList();
}

// ════════════ MESSAGES ════════════
function escapeHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function appendMessage(role, content, images, animate = true) {
  const messagesEl = document.getElementById('messages');
  const welcome = document.getElementById('welcomeScreen');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = `message-row ${role}`;

  if (role === 'assistant') {
    row.innerHTML = `
      <div class="msg-avatar ai">AI</div>
      <div class="msg-bubble ai">${marked.parse(content)}</div>`;
  } else {
    let imgHtml = '';
    if (images && images.length > 0) {
      imgHtml = images.map(src => `<img class="msg-img-preview" src="${src}" alt="uploaded">`).join('');
    }
    row.innerHTML = `
      <div class="msg-bubble user">
        ${imgHtml}
        ${content ? escapeHtml(content).replace(/\n/g,'<br>') : ''}
      </div>
      <div class="msg-avatar user">
        <i class="fa-solid fa-user" style="font-size:0.72rem"></i>
      </div>`;
  }

  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  row.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  return row;
}

function addThinkingBubble() {
  const messagesEl = document.getElementById('messages');
  const welcome = document.getElementById('welcomeScreen');
  if (welcome) welcome.remove();
  const row = document.createElement('div');
  row.className = 'message-row assistant';
  row.id = 'thinking-row';
  row.innerHTML = `<div class="msg-avatar ai">AI</div><div class="msg-bubble ai"><div class="thinking-dots"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeThinkingBubble() {
  const el = document.getElementById('thinking-row');
  if (el) el.remove();
}

// ════════════ SEND MESSAGE ════════════
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  const imgs = [...pendingImages];
  if (!text && imgs.length === 0) return;
  if (!currentChatId) newChat();

  input.value = '';
  input.style.height = 'auto';
  pendingImages = [];
  renderPreviewStrip();

  const chat = chats.find(c => c.id === currentChatId);
  if (!chat) return;

  const userMsg = { role: 'user', content: text, images: imgs.map(i => i.dataUrl) };
  chat.messages.push(userMsg);

  if (chat.title === 'Жаңа чат...' && chat.messages.length === 1) {
    chat.title = (text || 'Сурет').slice(0, 36) + (text.length > 36 ? '...' : '');
  }
  renderChatList();
  appendMessage('user', text, imgs.map(i => i.dataUrl));

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('headerSub').innerHTML = '<span class="status-dot"></span> Жауап дайындалуда...';
  addThinkingBubble();

  try {
    const geminiContents = chat.messages.map(m => {
      if (m.role === 'assistant') {
        return { role: 'model', parts: [{ text: m.content }] };
      } else {
        const parts = [];
        if (m.images && m.images.length > 0) {
          m.images.forEach(dataUrl => {
            const b64 = dataUrl.split(',')[1];
            const mime = dataUrl.split(';')[0].split(':')[1];
            parts.push({ inline_data: { mime_type: mime, data: b64 } });
          });
        }
        if (m.content) parts.push({ text: m.content });
        return { role: 'user', parts };
      }
    });

    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: geminiContents,
        generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
      })
    });

    removeThinkingBubble();

    if (!response.ok) {
      const err = await response.json();
      throw new Error(`API қатесі ${response.status}: ${err?.error?.message || ''}`);
    }

    const data = await response.json();
    const fullText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    appendMessage('assistant', fullText);
    chat.messages.push({ role: 'assistant', content: fullText });
    renderChatList();

  } catch (err) {
    removeThinkingBubble();
    appendMessage('assistant', `**Қате орын алды** 😔\n\n${err.message}\n\nБірнеше секундтан кейін қайталап көріңіз.`);
  } finally {
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('headerSub').innerHTML = '<span class="status-dot"></span> Сұрағыңызды қойыңыз';
    document.getElementById('userInput').focus();
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ════════════ INIT — әрдайым жаңа чат ════════════
marked.setOptions({ breaks: true, gfm: true });
renderChatList();
newChat(); // Беттің жүктелуімен бірге жаңа чат ашылады
</script>
