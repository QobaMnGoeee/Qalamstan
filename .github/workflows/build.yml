name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3" "ndk;22.1.7171670"

      - name: Locate project
        id: src
        shell: bash
        run: |
          if [ -z "$(find . -name gradlew -not -path './.git/*' -print -quit)" ]; then
            ZIP="$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' -print -quit)"
            if [ -n "$ZIP" ]; then
              echo "Unpacking $ZIP"
              unzip -q "$ZIP" -d _src
            fi
          fi
          GRADLEW="$(find . -name gradlew -not -path './.git/*' -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found. Repository contents:"
            find . -not -path './.git/*' -not -path './.git' | head -n 50
            exit 1
          fi
          DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APKs
        working-directory: ${{ steps.src.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Generate sha256sums
        working-directory: ${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug
        run: sha256sum *.apk > sha256sums

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KazMinal-debug-apks
          path: |
            ${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/sha256sums
          if-no-files-found: error
