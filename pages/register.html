<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — TURAN STUDIO</title>
<meta name="description" content="Создайте аккаунт TURAN STUDIO, чтобы отслеживать свои заявки и общаться с командой.">
<link rel="canonical" href="https://turanstudio.kz/pages/register.html">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#F7F9FC">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../assets/images/logo/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/pages/forms.css">
</head>
<body>
<div class="auth-screen">
<div class="auth-screen-visual">
<div class="auth-screen-visual-content">
<svg viewBox="0 0 380 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Иллюстрация: разработчик приветствует нового участника">
<ellipse cx="190" cy="308" rx="150" ry="20" fill="rgba(255,255,255,0.14)"/>
<circle cx="190" cy="140" r="70" fill="rgba(255,255,255,0.08)"/>
<g>
<ellipse cx="140" cy="300" rx="34" ry="8" fill="rgba(16,27,51,0.1)"/>
<rect x="118" y="228" width="35" height="53" rx="16" fill="#FDF3DE"/>
<circle cx="140" cy="212" r="20" fill="#F2C4A0"/>
<path d="M120 207c0-13 9-23 20-23s20 10 20 23c-6-4-13-5-20-5s-14 1-20 5z" fill="#2A1B10"/>
<circle cx="133" cy="213" r="2" fill="#2A1B10"/>
<circle cx="147" cy="213" r="2" fill="#2A1B10"/>
<path d="M134 221q6 3 12 0" stroke="#2A1B10" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<path d="M118 240 Q100 250 96 268" stroke="#F2C4A0" stroke-width="9" stroke-linecap="round" fill="none"/>
<path d="M162 240 Q180 232 192 216" stroke="#F2C4A0" stroke-width="9" stroke-linecap="round" fill="none"/>
</g>
<g>
<ellipse cx="245" cy="300" rx="34" ry="8" fill="rgba(16,27,51,0.1)"/>
<rect x="223" y="228" width="35" height="53" rx="16" fill="var(--color-gold)"/>
<circle cx="245" cy="212" r="20" fill="#E8B98C"/>
<path d="M225 206c0-13 9-24 20-24s20 11 20 24c-6-4-13-5-20-5s-14 1-20 5z" fill="#1A100A"/>
<circle cx="238" cy="213" r="2" fill="#1A100A"/>
<circle cx="252" cy="213" r="2" fill="#1A100A"/>
<path d="M239 221q6 3 12 0" stroke="#1A100A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<path d="M223 240 Q205 232 193 216" stroke="#E8B98C" stroke-width="9" stroke-linecap="round" fill="none"/>
<path d="M267 240 Q285 250 289 268" stroke="#E8B98C" stroke-width="9" stroke-linecap="round" fill="none"/>
</g>
<path d="M190 70 L198 90 L218 96 L198 102 L190 122 L182 102 L162 96 L182 90 Z" fill="var(--color-gold)"/>
<circle cx="80" cy="150" r="4" fill="rgba(255,255,255,0.6)"/>
<circle cx="310" cy="160" r="3.5" fill="var(--color-gold)" opacity="0.7"/>
<circle cx="60" cy="230" r="3" fill="rgba(255,255,255,0.5)"/>
</svg>
</div>
</div>
<div class="auth-screen-form">
<div class="auth-form-wrapper">
<a class="auth-form-brand" href="../index.html">
</a>
<div class="auth-tabs">
<a class="auth-tab" href="login.html" data-t="auth_login_tab">Вход</a>
<a class="auth-tab active" href="register.html" data-t="auth_register_tab">Регистрация</a>
</div>
<h1 class="auth-form-title" data-t="register_title">Создать аккаунт</h1>

<div class="err-msg" id="regErr"></div>

<div class="field">
<label class="lbl" for="regName" data-t="register_name_label">Ваше имя</label>
<input class="inp" type="text" id="regName" placeholder="Моя Имя..." autocomplete="name">
</div>
<div class="field">
<label class="lbl" for="regEmail" data-t="register_email_label">Email</label>
<input class="inp" type="email" id="regEmail" placeholder="youremail@example.com" autocomplete="email">
</div>
<div class="field">
<label class="lbl" for="regPass" data-t="register_password_label">Пароль</label>
<div class="password-field-wrap">
<input class="inp" type="password" id="regPass" data-tp="auth_password_placeholder" placeholder="Пароль" autocomplete="new-password">
<button class="password-toggle-btn" type="button" data-toggle-password="regPass" aria-label="Показать пароль">
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
</button>
</div>
</div>
<div class="field">
<label class="lbl" for="regPass2" data-t="register_confirm_label">Повторите пароль</label>
<div class="password-field-wrap">
<input class="inp" type="password" id="regPass2" data-tp="auth_password_placeholder" placeholder="Пароль" autocomplete="new-password">
<button class="password-toggle-btn" type="button" data-toggle-password="regPass2" aria-label="Показать пароль">
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
</button>
</div>
</div>

<div class="auth-form-actions">
<button class="btn btn-primary btn-block btn-lg" type="button" id="regBtn" data-t="register_submit">Продолжить</button>
</div>

<div class="auth-divider"><span data-t="auth_or_divider">или</span></div>

<button class="google-btn" type="button" id="regGoogleBtn">
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
<span data-t="auth_google_btn">Войти через Google</span>
</button>

<p class="auth-switch"><span data-t="register_switch_text">Уже есть аккаунт?</span> <a href="login.html" data-t="register_switch_link" style="color:var(--color-blue);font-weight:700">Войти</a></p>
</div>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="../js/firebase/firebase-config.js"></script>
<script src="../js/i18n/translations.js"></script>
<script src="../js/i18n/i18n-engine.js"></script>
<script src="../js/firebase/auth.js"></script>
</body>
</html>
