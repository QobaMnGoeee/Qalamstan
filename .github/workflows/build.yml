name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3" "ndk;22.1.7171670"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Generate sha256sums
        working-directory: app/build/outputs/apk/debug
        run: sha256sum *.apk > sha256sums

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KazMinal-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/sha256sums
          if-no-files-found: error
