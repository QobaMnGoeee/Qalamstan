    <div id="news"></div>
    <script>
        // Fixing XSS in news rendering
        function renderNews(newsArray) {
            const newsContainer = document.getElementById('news');
            newsContainer.innerHTML = newsArray.map(news => { 
                return `<div>${escapeHTML(news.title)}</div>`;
            }).join('');
        }

        function escapeHTML(unsafe) {
            return unsafe
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
